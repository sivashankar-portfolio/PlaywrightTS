<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Demo</title>
</head>
<body>

  <button id="loginBtn" user-id="login-button" onclick="handleLogin()">Login</button>
  <div id="message"></div>

  <script>
    function handleLogin() {
      document.getElementById('message').innerText = 'Login Success';
    }
  </script>

</body>
</html>
